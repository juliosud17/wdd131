<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo: círculo vinho -->
  <circle cx="32" cy="32" r="32" fill="#7a1017"/>

  <!-- Sol e nuvem descem 3 unidades para ficar centralizados no círculo -->
  <g transform="translate(0 3)">
  <!-- Sol: raios e disco amarelo -->
  <g stroke="#f1bf00" stroke-width="2.5" stroke-linecap="round">
    <line x1="14" y1="27" x2="10" y2="27"/>
    <line x1="17.2" y1="19.2" x2="14.4" y2="16.4"/>
    <line x1="25" y1="16" x2="25" y2="12"/>
    <line x1="32.8" y1="19.2" x2="35.6" y2="16.4"/>
    <line x1="17.2" y1="34.8" x2="14.4" y2="37.6"/>
  </g>
  <circle cx="25" cy="27" r="8" fill="#f1bf00"/>

  <!-- Nuvem: círculos brancos sobrepostos na frente do sol -->
  <g fill="#ffffff">
    <circle cx="24" cy="40" r="6"/>
    <circle cx="31" cy="35" r="8"/>
    <circle cx="41" cy="33" r="9"/>
    <circle cx="47" cy="40" r="6"/>
    <rect x="18" y="38" width="35" height="8" rx="4"/>
  </g>
  </g>
</svg>
