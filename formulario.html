
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulário de avaliação de produto: escolha o produto, dê uma nota de 1 a 5 estrelas, informe a data de instalação e conte sua experiência.">
  <meta name="author" content="Julio Antunes">

  <title>Avaliação do Produto</title>

  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/formulario.js" defer></script>
</head>

<body>

  <header>
    <h1>Avaliação do Produto</h1>
  </header>

  <main>
    <form method="get" action="avaliacao.html">

      <!-- Nome do Produto -->
      <div class="campo">
        <label for="produto">Nome do Produto *</label>

        <select id="produto" name="produto" required>
          <option value="" disabled selected>
            Selecione um Produto...
          </option>
        </select>
      </div>

      <!-- Classificação Geral -->
      <fieldset class="campo">
        <legend>Classificação Geral *</legend>

        <div class="classificacao">
          <label for="estrela1">
            ☆
            <input type="radio" id="estrela1"
                   name="classificacao" value="1" required>
          </label>

          <label for="estrela2">
            ☆☆
            <input type="radio" id="estrela2"
                   name="classificacao" value="2" required>
          </label>

          <label for="estrela3">
            ☆☆☆
            <input type="radio" id="estrela3"
                   name="classificacao" value="3" required>
          </label>

          <label for="estrela4">
            ☆☆☆☆
            <input type="radio" id="estrela4"
                   name="classificacao" value="4" required>
          </label>

          <label for="estrela5">
            ☆☆☆☆☆
            <input type="radio" id="estrela5"
                   name="classificacao" value="5" required>
          </label>
        </div>
      </fieldset>

      <!-- Data de Instalação -->
      <div class="campo">
        <label for="data">Data de Instalação *</label>
        <input type="date" id="data"
               name="data" required>
      </div>

      <!-- Recursos Úteis -->
      <fieldset class="campo">
        <legend>
          Quais recursos você achou úteis no produto?
          (Marque todos os que se aplicam)
        </legend>

        <div class="opcao">
          <input type="checkbox" id="durabilidade"
                 name="recursos" value="durabilidade">
          <label for="durabilidade">Durabilidade</label>
        </div>

        <div class="opcao">
          <input type="checkbox" id="facilidade"
                 name="recursos" value="facilidade">
          <label for="facilidade">Facilidade de Uso</label>
        </div>

        <div class="opcao">
          <input type="checkbox" id="desempenho"
                 name="recursos" value="desempenho">
          <label for="desempenho">Desempenho</label>
        </div>

        <div class="opcao">
          <input type="checkbox" id="design"
                 name="recursos" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <!-- Avaliação Escrita -->
      <div class="campo">
        <label for="comentario">
          Avaliação Escrita (Opcional)
        </label>

        <textarea id="comentario"
                  name="comentario" rows="6"></textarea>
      </div>

      <!-- Nome do Usuário -->
      <div class="campo">
        <label for="usuario">
          Seu Nome (Opcional)
        </label>

        <input type="text" id="usuario"
               name="usuario">
      </div>

      <p>* Campos obrigatórios</p>

      <!-- Enviar Formulário -->
      <input type="submit" value="Publicar Avaliação">

    </form>
  </main>

<footer>
        <p>&copy; <span id="anoatual"></span> Júlio César Moreira Antunes — São Paulo/Brasil</p>
        <p id="ultimaModificacao"></p>
    </footer>

</body>
</html>
