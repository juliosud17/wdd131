<!-- celular padrão -->

<body>
<!-- CABEÇALHO AQUI -->
	<header>
        <h1>Proposta de Curso</h1>
        <h2>Design de Formulários Web</h2>
    </header>
    
    
<!-- NAVEGAÇÃO AQUI -->
    <nav>
        <ul>
            <li><a href="#">Sobre</a></li>
            <li class="ativo"><a href="#">Propor</a></li>
            <li><a href="#">Vencedores</a></li>
            <li><a href="#">Contato</a></li>    
        </ul>
    </nav>
    
    
<!-- CONTEÚDO AQUI -->
<main>
    <h1>Formulário de Proposta de Curso</h1>
    <form method="GET" action="obrigado.html" class="form1">
        <fieldset>
            <legend>Informações do Candidato</legend>
            <label>Nome*<input type="text" name="nome" required></label>
            <label>Sobrenome*<input type="text" name="sobrenome" required></label>
            <label>Telefone*<input type="tel" name="telefone" placeholder="(00) 00000-0000" required></label>
            <label>E-mail*<input type="email" name="email" placeholder="seu.email@exemplo.com" required></label>
            <label>Website*<input type="url" name="website" placeholder="https://seu-website.com" required></label>
        </fieldset>

        <fieldset>
            <legend>Informações do Curso</legend>
            <div>Público-alvo</div>
            <label><input type="radio" name="publico" value="iniciante" required> Iniciante</label>
            <label><input type="radio" name="publico" value="intermediario" required> Intermediário</label>
            <label><input type="radio" name="publico" value="avancado" required> Avançado</label>

            <div>Software Necessário</div>
            <label><input type="checkbox" name="edicao" value="sim"> Edição de Fotos</label>
            <label><input type="checkbox" name="programacao" value="sim"> Programação</label>
            <label><input type="checkbox" name="processador" value="sim"> Pré-Processador</label>
            <label><input type="checkbox" name="cliente" value="sim"> Cliente FTP</label>
        </fieldset>

        <fieldset>
            <legend>Financiamento</legend>
            <label>Data prevista  de conclusão<input type="date" name="data"></label>

            <label>Área do Curso
                <select name="tema">
                    <option value="">Selecione uma área</option>
                    <option value="Software">Desenvolvimento de Software</option>
                    <option value="Criativo">Design Criativo</option>
                    <option value="TI">Tecnologia da Informação</option>
                    <option value="Data">Análise de Dados</option>
                    <option value="Construção">Construção Civil</option>
                    <option value="Manufatura">Manufatura</option>
                    <option value="Negócios">Negócios</option>
                    <option value="Segurança">Segurança Cibernética</option>

                </select>
            </label>

            <label>Quantidade de autores<input type="number" name="autores" min="1"></label>

        </fieldset>
    
        <input type="submit" value="Propor meu curso">

    </form>
</main>
